<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Outreach Draft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-right: 10px;
        }

        .badge.success {
            background: #10b981;
        }

        .badge.warning {
            background: #f59e0b;
        }

        .badge.info {
            background: #3b82f6;
        }

        .score {
            font-size: 3em;
            font-weight: bold;
            color: #10b981;
            text-align: center;
            margin: 20px 0;
        }

        .email-preview {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 25px;
            margin: 20px 0;
        }

        .email-to {
            font-size: 0.95em;
            color: #6b7280;
            margin-bottom: 15px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 4px;
        }

        .email-to strong {
            color: #374151;
        }

        .email-recipient {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 12px;
            margin: 2px;
            font-size: 0.9em;
        }

        .email-subject {
            font-weight: 600;
            color: #1f2937;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .email-body {
            line-height: 1.8;
            color: #374151;
        }

        .email-body p {
            margin: 0 0 1em 0;
        }

        .email-body ul {
            margin: 1em 0;
            padding-left: 25px;
        }

        .email-body li {
            margin: 0.5em 0;
        }

        .email-body strong {
            font-weight: 600;
            color: #1f2937;
        }

        .email-body a {
            color: #667eea;
            text-decoration: none;
        }

        .email-body a:hover {
            text-decoration: underline;
        }

        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: #667eea;
            color: white;
        }

        .btn-secondary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-tertiary {
            background: #6b7280;
            color: white;
        }

        .btn-tertiary:hover {
            background: #4b5563;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-card {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
        }

        .info-card strong {
            color: #667eea;
            display: block;
            margin-bottom: 8px;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .skill-tag {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tech-tag {
            background: #d1fae5;
            color: #065f46;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
        }

        .recommendation {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        .recommendation h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .confidence-bar {
            width: 100%;
            height: 30px;
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .confidence-fill {
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: width 1s ease;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
        }

        @media (max-width: 768px) {
            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="loading">
            <h2>Loading draft...</h2>
        </div>
    </div>

    <script>
        // INJECT_JSON_DATA_HERE
        // Data will be injected above as: const embeddedDraftData = {...};

        // Get JSON file path from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const jsonFile = urlParams.get('json') || window.location.pathname.replace('.html', '.json');

        let draftData = null;

        // Load and render draft
        async function loadDraft() {
            try {
                // Use embedded data if available (preferred)
                if (typeof embeddedDraftData !== 'undefined') {
                    draftData = embeddedDraftData;
                    renderDraft(draftData);
                    return;
                }

                // Fallback to fetching (won't work with file:// protocol)
                const response = await fetch(jsonFile);
                if (!response.ok) throw new Error('Failed to load draft');

                draftData = await response.json();
                renderDraft(draftData);
            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <h2>❌ Error Loading Draft</h2>
                        <p>${error.message}</p>
                        <p>Looking for: ${jsonFile}</p>
                        <p style="margin-top: 15px; font-size: 0.9em;">
                            <strong>Tip:</strong> Regenerate the HTML to embed updated data:<br>
                            <code style="background: #fff; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-top: 5px;">
                                python draft_viewer.py ${jsonFile}
                            </code>
                        </p>
                    </div>
                `;
            }
        }

        function renderDraft(data) {
            const jobInfo = data.job_info || {};
            const companyResearch = data.company_research || {};
            const experienceMatch = data.experience_match || {};
            const channelRec = data.channel_recommendation || {};
            const strategy = data.strategy || {};
            const content = strategy.content || {};

            // Get all emails
            const allEmails = jobInfo.all_emails || (jobInfo.recruiter_email ? [jobInfo.recruiter_email] : []);
            const emailsHtml = allEmails.map(email =>
                `<span class="email-recipient">${email}</span>`
            ).join(' ');

            // Render relevant experience
            const relevantExpHtml = (experienceMatch.relevant_experience || [])
                .map(exp => `<li>${exp}</li>`)
                .join('');

            // Render matching skills
            const matchingSkillsHtml = (experienceMatch.matching_skills || [])
                .slice(0, 10)
                .map(skill => `<span class="skill-tag">${skill}</span>`)
                .join('');

            // Render tech stack
            const techStackHtml = (companyResearch.tech_stack || [])
                .map(tech => `<span class="tech-tag">${tech}</span>`)
                .join('');

            const confidence = Math.round((channelRec.confidence || 0.9) * 100);

            // Get email body (prefer HTML version)
            const emailBody = content.body_html || content.body || 'N/A';

            const html = `
                <div class="header">
                    <h1>🚀 Job Outreach Draft Ready</h1>
                    <p>${jobInfo.company_name || 'Unknown'} - ${jobInfo.role || 'Unknown Role'}</p>
                </div>

                <div class="content">
                    <!-- Recommendation Section -->
                    <div class="recommendation">
                        <h3>📧 Recommended Channel: ${(strategy.channel || 'EMAIL').toUpperCase()}</h3>
                        <p>${channelRec.reason || 'Recommended based on available contact info'}</p>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${confidence}%">
                                ${confidence}% Confidence
                            </div>
                        </div>
                    </div>

                    <!-- Match Score -->
                    <div class="section">
                        <h2>🎯 Experience Match</h2>
                        <div class="score">${experienceMatch.relevance_score || 0}/10</div>
                        <div class="info-grid">
                            <div class="info-card">
                                <strong>Relevant Experience:</strong>
                                <ul style="margin-left: 20px; margin-top: 10px;">
                                    ${relevantExpHtml}
                                </ul>
                            </div>
                            <div class="info-card">
                                <strong>Matching Skills:</strong>
                                <div class="skills-list">
                                    ${matchingSkillsHtml}
                                </div>
                            </div>
                        </div>
                        <p style="margin-top: 15px; color: #667eea; font-weight: 600;">
                            💪 ${experienceMatch.unique_strengths || 'Strong technical background'}
                        </p>
                    </div>

                    <!-- Company Research -->
                    <div class="section">
                        <h2>🏢 Company Research</h2>
                        <div class="info-grid">
                            <div class="info-card">
                                <strong>What They Build:</strong>
                                <p>${companyResearch.what_they_build || 'N/A'}</p>
                            </div>
                            <div class="info-card">
                                <strong>Company Stage:</strong>
                                <p><span class="badge info">${(companyResearch.stage || 'unknown').toUpperCase()}</span></p>
                            </div>
                        </div>
                        <div style="margin-top: 15px;">
                            <strong>Tech Stack:</strong>
                            <div class="tech-stack">
                                ${techStackHtml}
                            </div>
                        </div>
                        <div style="margin-top: 15px;">
                            <strong>Context:</strong>
                            <p style="margin-top: 10px;">${companyResearch.relevant_context || 'N/A'}</p>
                        </div>
                        <p style="margin-top: 15px;">
                            <strong>Website:</strong> <a href="${companyResearch.website_url || '#'}" target="_blank" style="color: #667eea;">${companyResearch.website_url || 'N/A'}</a>
                        </p>
                    </div>

                    <!-- Email Draft -->
                    <div class="section">
                        <h2>✉️ Email Draft</h2>
                        <div class="email-preview">
                            ${allEmails.length > 0 ? `
                                <div class="email-to">
                                    <strong>To:</strong> ${emailsHtml}
                                    ${allEmails.length > 1 ? `<br><small style="color: #6b7280; margin-top: 5px; display: block;">✓ ${allEmails.length} recipients (email will be sent to all)</small>` : ''}
                                </div>
                            ` : ''}
                            <div class="email-subject">
                                <strong>Subject:</strong> ${content.subject || 'N/A'}
                            </div>
                            <div class="email-body" id="email-body-content"></div>
                        </div>
                    </div>

                    <!-- Job Details -->
                    <div class="section">
                        <h2>📋 Job Details</h2>
                        <div class="info-grid">
                            <div class="info-card">
                                <strong>Company:</strong>
                                <p>${jobInfo.company_name || 'N/A'}</p>
                            </div>
                            <div class="info-card">
                                <strong>Role:</strong>
                                <p>${jobInfo.role || 'N/A'}</p>
                            </div>
                            <div class="info-card">
                                <strong>Contact Email${allEmails.length > 1 ? 's' : ''}:</strong>
                                <div style="margin-top: 5px;">${emailsHtml || 'N/A'}</div>
                            </div>
                        </div>
                        <div style="margin-top: 15px;">
                            <strong>Requirements:</strong>
                            <p style="margin-top: 10px;">${jobInfo.requirements || 'N/A'}</p>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="actions">
                        <button class="btn btn-primary" onclick="sendDraft()">
                            ✅ Send Email${allEmails.length > 1 ? 's' : ''} Now
                        </button>
                        <button class="btn btn-secondary" onclick="editDraft()">
                            ✏️ Edit Draft
                        </button>
                        <button class="btn btn-secondary" onclick="regenerateInstructions()">
                            🔄 Regenerate
                        </button>
                        <button class="btn btn-tertiary" onclick="window.close()">
                            ❌ Cancel
                        </button>
                    </div>

                    <div style="text-align: center; margin-top: 20px; color: #6b7280; font-size: 0.9em;">
                        <p>Draft file: ${jsonFile}</p>
                        <p>Generated: ${data.generated_at || 'Unknown'}</p>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = html;

            // Set email body as HTML (to properly render formatting)
            const emailBodyElement = document.getElementById('email-body-content');
            if (emailBodyElement && emailBody) {
                emailBodyElement.innerHTML = emailBody;
            }
        }

        function sendDraft() {
            if (!draftData) return;

            const allEmails = draftData.job_info.all_emails || [];
            const emailList = allEmails.join(', ');

            const confirmed = confirm(`Are you sure you want to send this email to:\n\n${emailList}\n\n(${allEmails.length} recipient${allEmails.length > 1 ? 's' : ''})`);

            if (confirmed) {
                const command = `cd job-outreach-agent && python send_draft.py ${jsonFile}`;
                alert(`To send this email, run in terminal:\n\n${command}`);

                // Copy to clipboard
                navigator.clipboard.writeText(command)
                    .then(() => console.log('Command copied to clipboard!'))
                    .catch(() => console.log('Copy failed'));
            }
        }

        function editDraft() {
            if (!draftData) return;

            const instructions = `To edit the draft:\n\n` +
                `1. Open: ${jsonFile}\n` +
                `2. Edit the "content" section or "job_info.all_emails"\n` +
                `3. Save the file\n` +
                `4. Regenerate HTML: python draft_viewer.py ${jsonFile}\n` +
                `5. Refresh this page to see changes`;
            alert(instructions);
        }

        function regenerateInstructions() {
            const command = `python draft_viewer.py ${jsonFile}`;
            alert(`After editing the JSON, regenerate the HTML:\n\n${command}`);

            // Copy to clipboard
            navigator.clipboard.writeText(`cd job-outreach-agent && ${command}`)
                .then(() => console.log('Command copied to clipboard!'))
                .catch(() => console.log('Copy failed'));
        }

        // Load draft on page load
        loadDraft();
    </script>
</body>
</html>
